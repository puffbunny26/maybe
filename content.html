<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 组织进化蓝图 | Winnie</title>
    <style>
        /* 核心审美：极简、通透、Yahei UI */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei UI", sans-serif; }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #667eea, #764ba2);
            color: #fff;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 50px; }
        .header h1 { font-weight: 300; letter-spacing: 5px; font-size: 2rem; margin-bottom: 10px; }
        .header .line { width: 50px; height: 3px; background: #fff; margin: 0 auto; opacity: 0.5; }

        /* 矩阵容器：PC端三列，手机端单列 */
        .matrix-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        /* 磨砂玻璃卡片 */
        .module-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 35px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .module-card:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }

        /* 模块标题与标签 */
        .mod-title { font-size: 1.4rem; font-weight: 600; margin-bottom: 15px; color: #fff; }
        .mod-tag { 
            display: inline-block; padding: 4px 12px; background: rgba(255,255,255,0.2); 
            border-radius: 8px; font-size: 0.85rem; margin-bottom: 25px; color: #eee;
        }

        /* 定位与金句 */
        .positioning { font-size: 1.1rem; color: #e0e0e0; margin-bottom: 25px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
        .positioning b { color: #fff; font-weight: 600; }

        /* 任务清单 */
        .task-list { list-style: none; flex-grow: 1; }
        .task-list li { margin-bottom: 18px; line-height: 1.6; font-size: 0.95rem; opacity: 0.9; position: relative; padding-left: 20px;
