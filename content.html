<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目详情 | Winnie 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei UI", sans-serif; }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at bottom right, #764ba2, #667eea);
            color: #fff;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .content-container {
            width: 100%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }
        h2 { font-weight: 300; letter-spacing: 2px; margin-bottom: 30px; border-left: 4px solid #fff; padding-left: 15px; }
        p { line-height: 1.8; opacity: 0.9; margin-bottom: 20px; font-size: 1.05rem; }
        .back-btn {
            display: inline-block;
            margin-top: 30px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-btn:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="content-container">
        <h2>AI 激励计划与组织进化</h2>
        <p>这是你的第二个页面。你可以在这里详细描述你的 AI 策略：</p>
        <p>1. <b>工具普及</b>：通过游戏化激励，提升团队对 AI 工具的依赖度。</p>
        <p>2. <b>流程重塑</b>：将 AI 融入招聘、培训与绩效的全生命周期。</p>
        <p>3. <b>文化转型</b>：构建“技术辅助，感性决策”的未来职场氛围。</p>
        
        <a href="index.html" class="back-btn">← 返回首页</a>
    </div>
</body>
</html>
