<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>述职空间 | 2026</title>
    <style>
        /* 核心审美：Mario/Claw 质感、极简通透、iOS 级平滑位移 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei UI", "微软雅黑", sans-serif; }
        
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #667eea, #764ba2);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* 保持系统化仪表盘质感 */
        }

        /* 顶部装饰线与全局标题 */
        .global-header {
            text-align: center;
            padding: 40px 20px 20px;
            transition: all 0.6s ease;
            width: 100%;
        }
        .global-header h1 { font-weight: 300; font-size: 1.5rem; letter-spacing: 2px; }
        
        /* 核心容器：状态切换机 */
        .main-stage {
            flex: 1;
            width: 100%;
            max-width: 1400px;
            display: flex;
            gap: 20px;
            padding: 20px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        /* 模块卡片基础样式 */
        .module-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 28px;
            padding: 40px 30px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
        }

        .module-item:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-5px); }

        /* --- 导航模式下的变化 (Mode: Nav) --- */
        body.nav-mode .global-header { padding: 20px; opacity: 0.6; transform: scale(0.9); }
        
        body.nav-mode .main-stage {
            flex-direction: column;
            gap: 10px;
        }

        /* 导航栏形态：卡片收缩到顶部 */
        .nav-bar {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 1400px;
            padding: 0 20px;
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
            font-size: 0.9rem;
            opacity: 0.6;
            white-space: nowrap;
        }
        .nav-item.active { opacity: 1; background: rgba(255, 255, 255, 0.2); border-color: #fff; font-weight: 600; }

        /* 详情内容工作台 */
        .detail-workbench {
            display: none;
            flex: 1;
            width: 100%;
            max-width: 1400px;
            margin: 10px auto 20px;
            padding: 0 20px;
            overflow-y: auto;
            animation: slideUp 0.6s forwards;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 内容排版细节 */
        .content-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 50px;
            min-height: 80vh;
        }

        .mod-header-brief { margin-bottom: 40px; }
        .mod-header-brief h2 { font-size: 1.8rem; margin-bottom: 10px; }
        .mod-header-brief p { font-size: 1rem; opacity: 0.7; }

        .section-group { margin-bottom: 40px; }
        .section-label { font-size: 0.75rem; opacity: 0.4; letter-spacing: 2px; margin-bottom: 15px; display: block; border-left: 2px solid #fff; padding-left: 10px; }
        
        .list-item { list-style: none; margin-bottom: 20px; line-height: 1.8; font-size: 1rem; opacity: 0.9; position: relative; padding-left: 20px; }
        .list-item::before { content: "•"; position: absolute; left: 0; opacity: 0.5; }
        .list-item b { color: #fff; font-weight: 600; }

        .value-highlight { 
            background: rgba(255,255,255,0.05); 
            padding: 30px; border-radius: 20px; 
            border: 1px dashed rgba(255,255,255,0.2);
            font-size: 1.1rem; font-weight: 600;
        }

        .reflection-area { font-style: italic; opacity: 0.8; line-height: 1.7; background: rgba(0,0,0,0.1); padding: 25px; border-radius: 20px; font-size: 0.95rem; }

        .back-home { margin-top: 20px; display: inline-block; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.8rem; }

        /* 隐藏矩阵卡片的状态 */
        body.nav-mode .main-stage { display: none; }
        body.nav-mode .detail-workbench { display: block; }
        body.nav-mode .nav-bar { display: flex; }

        /* 默认隐藏导航栏 */
        .nav-bar { display: none; margin-top: 10px; }

        /* 响应式 */
        @media (max-width: 900px) {
            .main-stage { flex-direction: column; }
            .content-card { padding: 30px; }
        }
    </style>
</head>
<body id="mainBody">

    <div class="global-header">
        <h1>系统化思维驱动：从单点业务支撑到组织资产沉淀</h1>
    </div>

    <div class="main-stage" id="matrixContainer">
        <div class="module-item" onclick="enterDetail(0)">
            <h2 style="font-size: 1.4rem; margin-bottom: 15px;">专业基建 (深度)</h2>
            <p style="font-size: 0.9rem; opacity: 0.7; line-height: 1.5;">做 HR 复杂体系与 AI 的“翻译官”，实现数据分析报告 10 分钟极速产出。</p>
        </div>
        <div class="module-item" onclick="enterDetail(1)">
            <h2 style="font-size: 1.4rem; margin-bottom: 15px;">组织激活 (厚度)</h2>
            <p style="font-size: 0.9rem; opacity: 0.7; line-height: 1.5;">“10+6（石榴计划）”跨级带教，激活高职级专家动能，实现技术团队 AI 基因落地。</p>
        </div>
        <div class="module-item" onclick="enterDetail(2)">
            <h2 style="font-size: 1.4rem; margin-bottom: 15px;">系统资产 (广度)</h2>
            <p style="font-size: 0.9rem; opacity: 0.7; line-height: 1.5;">将非标业务动作转化为可复用的标准 SOP，提升团队交付底线，打破“重复造轮子”。</p>
        </div>
    </div>

    <div class="nav-bar" id="topNav">
        <div class="nav-item" onclick="switchDetail(0)">专业基建</div>
        <div class="nav-item" onclick="switchDetail(1)">组织激活</div>
        <div class="nav-item" onclick="switchDetail(2)">系统资产</div>
    </div>

    <div class="detail-workbench" id="workbench">
        <div class="content-card" id="detailContent">
            </div>
        <center><a href="index.html" class="back-home">← 返回门户首页</a></center>
    </div>

    <script>
        const projects = [
            {
                title: "专业基建 (深度)",
                focus: "从单兵破局到全线开源——做 HR 复杂体系与 AI 的“翻译官”",
                strategy: "复杂规则的“翻译官”",
                details: [
                    "<b>解码规则：</b> 将人力指标体系（如 T 序列人才矩阵、3S/5G模型等）系统解码，翻译成大模型能精准读取的“底层业务字典”。",
                    "<b>结构化封装：</b> 强制模型遵循“摘要➜概览➜结构现状➜流动分析➜交叉比对”五步框架，确保洞察精准。",
                    "<b>知识开源：</b> 总结出“喂数据➜建对话➜固知识➜调试输出”的四步法则，并在内部开源实操指南。"
                ],
                value: "极致效能跃迁：报告撰写由小时级压缩至 10 分钟；2 份日常沉淀获官方采纳进入职级标准迭代参考文档。",
                reflection: "目前解决了“写”的痛点，但生成洞察只是起点。未来需追踪报告是否真正推动了管理闭环，并探索建立动态更新的“公共指标字典库”。"
            },
            {
                title: "组织激活 (厚度)",
                focus: "业务中台“10+6（石榴计划）”与 AI 梯队建设",
                strategy: "梯队阵型的“操盘手”",
                details: [
                    "<b>跨级带教：</b> 推出“10+6”计划，由 E10 专家直接辅导 E6 校招生，用柔性杠杆激发高职级专家的管理动能。",
                    "<b>双向评估：</b> 策划师生全体同台述职，制定专用汇报模板，使辅导质量和新人产出不仅可见，而且可衡量。",
                    "<b>AI 沉浸植入：</b> 将 AI 能力考察设为转正考核必答题，倒逼师生在日常场景中重构 Agent 思维与应用。"
                ],
                value: "骨干激活：E10 获得了新的管理成就感。新人破局：11 位校招生平稳落地，其中 2 位获得年度 A 绩效。",
                reflection: "跨级带教需更精细的预期管理。下一步应将 AI 考核从定性交流转向量化指标，如关联卓越工程积分或内部 Agent 搭建数量。"
            },
            {
                title: "系统资产 (广度)",
                focus: "打破“重复造轮子”——将非标业务动作转化为可复用的标准 SOP",
                strategy: "组织记忆的“架构师”",
                details: [
                    "<b>凡做过必留资产：</b> 致力于将个人跑通的经验转化为公共资料，不再做单纯的活动执行者。",
                    "<b>流程拆解：</b> 针对晋升评审、新人训等项目，沉淀精确到时间点与对接人的“全景排期表”与“操作手册”。",
                    "<b>AI 减负：</b> 引入自动化链路，实现“主题生成➜视觉延展➜消息分发➜摘要提取”的闭环，将物料筹备变为“填空题”。"
                ],
                value: "拉升团队交付底线：使新接手项目的同事也能迅速达到 80分+ 交付标准。沉淀的 SOP 至今仍被高频复用。",
                reflection: "计划从静态 SOP 向更深度的“系统化封装”演进。同时需防范工具便捷化带来的路径依赖，确保效率跃迁不以牺牲评估严谨性为代价。"
            }
        ];

        function enterDetail(index) {
            document.getElementById('mainBody').classList.add('nav-mode');
            switchDetail(index);
        }

        function switchDetail(index) {
            const data = projects[index];
            const items = document.querySelectorAll('.nav-item');
            items.forEach((item, i) => {
                if(i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            const content = `
                <div class="mod-header-brief">
                    <p style="color:#667eea; font-weight:600; margin-bottom:10px;">项目详情</p>
                    <h2>${data.title}</h2>
                    <p>${data.focus}</p>
                </div>
                <div class="section-group">
                    <span class="section-label">策略与动作</span>
                    <p style="font-size:1.3rem; margin-bottom:25px;">${data.strategy}</p>
                    <ul>
                        ${data.details.map(li => `<li class="list-item">${li}</li>`).join('')}
                    </ul>
                </div>
                <div class="section-group">
                    <span class="section-label">业务价值</span>
                    <div class="value-highlight">${data.value}</div>
                </div>
                <div class="section-group">
                    <span class="section-label">不足与反思</span>
                    <div class="reflection-area">${data.reflection}</div>
                </div>
            `;
            const container = document.getElementById('detailContent');
            container.innerHTML = content;
            document.getElementById('workbench').scrollTop = 0;
        }
    </script>
</body>
</html>
