<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnie | 2026 AI HRBP</title>
    <style>
        /* 核心审美：Mario 极简蓝、HarmonyOS 级通透、Yahei UI */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei UI", "微软雅黑", sans-serif; }
        
        body {
            height: 100vh;
            /* 模拟 Mario 官网的微网格 + 极简蓝背景 */
            background-color: #f8f9fa;
            background-image: 
                radial-gradient(circle at 100% 0%, rgba(0, 82, 255, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(0, 82, 255, 0.05) 0%, transparent 50%),
                linear-gradient(rgba(0,0,0,.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 顶部 Logo 标识 */
        .top-brand {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 1rem;
            font-weight: 700;
            color: #111;
            letter-spacing: 1px;
        }
        .top-brand span { color: #0052ff; }

        /* 核心互动卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 40px;
            padding: 60px 50px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.05);
            animation: float 6s ease-in-out infinite;
        }

        .tag {
            background: rgba(0, 82, 255, 0.1);
            color: #0052ff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            display: inline-block;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 10px;
            color: #111;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #666;
            margin-bottom: 50px;
            font-weight: 400;
        }

        /* 极简流光按钮 */
        .explore-btn {
            display: inline-block;
            background: #0052ff;
            color: #fff;
            padding: 18px 50px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            box-shadow: 0 10px 30px rgba(0, 82, 255, 0.2);
        }

        .explore-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 82, 255, 0.3);
        }

        /* 按钮内部流光 */
        .explore-btn::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        /* 动画定义 */
        @keyframes shine {
            0% { left: -100%; transition: 0s; }
            20% { left: 100%; transition: 0.6s; }
            100% { left: 100%; transition: 0.6s; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; letter-spacing: 5px; }
            .glass-card { padding: 40px 30px; }
        }
    </style>
</head>
<body>

    <div class="top-brand">WINNIE | <span>2026</span></div>

    <div class="glass-card">
        <div class="tag">AI HRBP · 2026</div>
        <h1>WINNIE</h1>
        <p>连接 AI 潜能与人力智慧<br>在数字化转型中<br>构建细腻、敏捷、有温度的未来</p>
        
        <a href="content.html" class="explore-btn">开始探索</a>
    </div>

</body>
</html>
