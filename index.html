<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winnie | 2026 AI HRBP</title>
<style>

{ margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei UI", sans-serif; }
body {
height: 100vh; display: flex; justify-content: center; align-items: center;
background: radial-gradient(circle at top left, #667eea, #764ba2);
overflow: hidden; perspective: 1000px;
}
.glass-card {
position: relative; z-index: 10; width: 90%; max-width: 420px; padding: 50px 35px;
background: rgba(255, 255, 255, 0.15);
backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 40px;
box-shadow: 0 25px 50px rgba(0,0,0,0.2); text-align: center; color: #fff;
transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); transform-style: preserve-3d;
}
.glass-card:hover { transform: translateY(-15px) rotateX(5deg) rotateY(5deg); }
h1 { font-size: 2.4rem; margin-bottom: 20px; font-weight: 300; letter-spacing: 2px; }
.tag { display: inline-block; padding: 5px 15px; background: rgba(255,255,255,0.2); border-radius: 20px; font-size: 0.8rem; margin-bottom: 25px; }
p { opacity: 0.9; line-height: 1.8; font-size: 1rem; margin-bottom: 35px; }
.btn {
padding: 16px 45px; background: #fff; color: #764ba2; text-decoration: none;
border-radius: 100px; font-weight: 600; transition: 0.4s; display: inline-block;
}
.btn:hover { transform: scale(1.1); background: #764ba2; color: #fff; }
</style>
</head>
<body>
<div class="glass-card">
<div class="tag">AI HRBP · 2026</div>
<h1>WINNIE</h1>
<p>连接 AI 潜能与人力智慧


在算法与感性之间


构建细腻流畅的职场未来</p>
<a href="#" class="btn">立即探索</a>
</div>
</body>
</html>
